<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f2f4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="동남아 족보">
<title>동남아 기말 족보</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!--
  동남아시아의 지역성과 문화(GEFC054) 기말 족보 · 모의고사 사이트
  - 내용(족보·모의고사)은 아래 PAYLOAD 안에 AES-GCM으로 암호화돼 있다. 접근키가 있어야 이 기기에서 풀린다.
  - 원본: 동남아시아의지역성과문화/04_산출물/족보문제집/동남아_기말족보.html (2026-10-29),
          04_산출물/모의고사/모의고사_기말_문제편·정답편.html (2026-10-20) — 빌드: 06_사이트/tools/build_site.py
  - 저장(localStorage): sea-final-v1 (데이터 버전 1), sea-key(접근키), sea-theme(테마 색)
-->
<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#191f28;--sub:#6b7684;--sub2:#8b95a1;--line:#e5e8eb;--fill:#f2f4f6;
  --brand:#0f7b6c;--brands:#e7f4f1;--on:#fff;--brandt:#0f7b6c;
  --o:#1f9d55;--os:#e6f6ec;--x:#e03131;--xs:#fdecec;--star:#f59f00;--mark:#fff6d8;
  --tabh:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
#view{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom))}

/* ── 잠금 ── */
.lock{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
.lock .em{font-size:44px;line-height:1}
.lock .k{font-size:13px;color:var(--sub);margin-top:16px}
.lock h1{font-size:27px;line-height:1.35;margin:4px 0 6px;letter-spacing:-.02em}
.lock p{color:var(--sub);margin:0 0 28px;font-size:15px}
.lock input{width:100%;font:inherit;font-size:19px;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;letter-spacing:.08em;text-transform:uppercase}
.lock input:focus{outline:none;border-color:var(--brand)}
.btn{display:block;width:100%;margin-top:12px;font-weight:700;font-size:17px;padding:16px;border:0;border-radius:14px;background:var(--brand);color:var(--on)}
.btn:disabled{opacity:.6}
.lock .err{color:var(--x);font-size:14px;min-height:22px;margin-top:10px}
.lock small{display:block;text-align:center;color:var(--sub2);margin-top:10px;font-size:13px}

/* ── 공통 헤더 ── */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 20px 8px}
.top .k{font-size:13px;color:var(--sub)}
.top h2{margin:2px 0 8px;font-size:24px;letter-spacing:-.02em}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;padding:7px 13px;border-radius:999px;border:0;background:#fff;color:var(--sub);font-weight:600}
.chip.on{background:var(--ink);color:#fff}
.tools{display:flex;gap:8px;padding:2px 0 4px}
.tool{flex:1;font-size:14px;font-weight:600;padding:10px 4px;border-radius:12px;border:0;background:#fff;color:var(--ink);white-space:nowrap}
.tool.on{background:var(--brands);color:var(--brandt)}
.tool.pri{background:var(--brand);color:var(--on)}
.tool:disabled{opacity:.45}

/* ── 홈 ── */
.hero{padding:calc(22px + env(safe-area-inset-top)) 20px 4px}
.hero .k{font-size:13px;color:var(--sub)}
.hero h1{font-size:26px;margin:2px 0 14px;letter-spacing:-.02em}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:#fff;border-radius:16px;padding:12px 14px}
.kpi b{display:block;font-size:24px;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--sub)}
.kpi .x b{color:var(--x)}.kpi .b b{color:var(--brandt)}
.pbar{height:8px;border-radius:9px;background:#e1e5ea;margin:14px 0 4px;overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.phr{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub)}
.big2{display:flex;gap:8px;margin:14px 20px 4px}
.big2 button{flex:1;font-weight:700;font-size:15.5px;padding:15px 14px;border-radius:16px;border:0;background:var(--brand);color:var(--on);text-align:left;line-height:1.35}
.big2 button small{display:block;font-weight:500;font-size:12.5px;opacity:.8;margin-top:2px}
.big2 button.l{background:#fff;color:var(--ink)}
.big2 button:disabled{opacity:.5}
.lab{font-size:13.5px;font-weight:700;color:var(--sub);padding:18px 20px 8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 20px}
.tile{background:#fff;border:0;border-radius:16px;padding:13px 14px;min-height:96px;display:flex;flex-direction:column;text-align:left}
.tile b{font-size:13px;color:var(--brandt)}
.tile .t{font-weight:700;font-size:15px;line-height:1.35}
.tile .m{margin-top:auto;padding-top:6px;font-size:12.5px;color:var(--sub);display:flex;gap:6px;justify-content:space-between;width:100%}
.tile .m em{font-style:normal;color:var(--x);font-weight:600}
.tile.ov b{color:var(--sub)}
.tile .mini-bar{height:4px;border-radius:4px;background:#eef1f4;margin-top:6px;overflow:hidden;display:flex;width:100%}
.tile .mini-bar i{height:100%}
.set{margin:8px 20px 0;background:#fff;border-radius:16px;padding:6px 16px}
.set .row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.set .row:last-child{border:0}
.set .row .sp{flex:1}
.sw{display:flex;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 2.5px var(--ink)}
.lnk{border:0;background:none;color:var(--sub);font-size:14px;font-weight:600;padding:4px 0}
.lnk.dng{color:var(--x)}
details.guide{margin:8px 20px 0;background:#fff;border-radius:16px;padding:12px 16px;font-size:14px;color:#4e5968}
details.guide summary{font-weight:700;color:var(--ink);cursor:pointer;font-size:15px}
details.guide div{margin-top:8px}
details.guide .oxbox .oq{font-size:11px}
.foot{text-align:center;font-size:12px;color:var(--sub2);padding:18px 20px 0}

/* ── 섹션·카드 ── */
.sh{padding:16px 20px 6px;font-weight:800;font-size:17px;line-height:1.45}
.sh span{color:var(--brandt);margin-right:6px}
.sh small{display:block;font-weight:400;font-size:13px;color:var(--sub)}
.card{background:var(--card);margin:0 12px 10px;border-radius:18px;padding:16px 18px;scroll-margin-top:200px;transition:background .3s}
.card.x{background:var(--mark)}
.card.flash{box-shadow:0 0 0 3px var(--brand)}
.ch{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.ch b{font-size:15.5px;line-height:1.45;flex:1}
.ch b span{color:var(--brandt);margin-right:4px}
.st{color:var(--star);font-size:13px;letter-spacing:-1px;white-space:nowrap;padding-top:2px}
.tier{font-size:11px;font-weight:800;border-radius:5px;padding:1px 6px;background:var(--fill);color:var(--sub);white-space:nowrap;margin-top:2px}
.tier.T1{background:var(--brands);color:var(--brandt)}
.cb{font-size:17px;line-height:1.8}
.bl{display:inline-block;min-width:3.4em;max-width:100%;padding:0 6px;margin:1px 2px;border-radius:7px;background:#eaedf1;text-align:center;color:transparent;position:relative;line-height:1.55;cursor:pointer;vertical-align:baseline}
.bl i{position:absolute;left:5px;top:0;font-style:normal;font-size:11px;color:#adb5bd}
.bl b{font-weight:700}
.bl.on{background:var(--brands);color:var(--brandt)}
.bl.on i{display:none}
.oxbox{display:inline-flex;vertical-align:1px;cursor:pointer}
.oxbox .oq{font-size:13px;font-weight:700;padding:1px 10px;border-radius:7px;background:#eaedf1;color:var(--sub);white-space:nowrap}
.oxbox b{display:none}
.oxbox.on .oq{display:none}
.oxbox.on b{display:inline-block;padding:0 12px;border-radius:7px;font-size:15px;color:#fff}
.oxbox b.o{background:var(--o)}.oxbox b.x{background:var(--x)}
.cm{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.src{font-size:12px;color:var(--sub);background:var(--fill);border-radius:6px;padding:2px 7px;white-space:nowrap}
.cm .sp{flex:1}
.cbtn{display:flex;gap:6px;margin-left:auto}
.mini{font-size:14px;font-weight:700;padding:8px 13px;border-radius:10px;border:0;background:var(--fill);color:var(--ink);white-space:nowrap}
.mini.k.on{background:var(--os);color:var(--o)}
.mini.x.on{background:#ffe08a;color:#7a5200}
.note{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;background:#f8f9fa;font-size:14.5px;color:#4e5968;line-height:1.7}
.card.open .note{display:block}
.empty{text-align:center;color:var(--sub);padding:48px 20px;font-size:15px}
.sdesc{font-size:13.5px;color:var(--sub);padding:0 20px 6px;line-height:1.55}

/* ── 시험지 ── */
.seg{display:flex;background:#e4e8ec;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;font-size:14px;font-weight:700;padding:8px 0;border-radius:9px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ehd{font-size:13px;color:var(--sub);padding:4px 20px 8px}
.esub{font-size:13px;font-weight:700;color:var(--sub);padding:10px 20px 6px}
.q{display:flex;gap:10px}
.q .qn{font-weight:800;color:var(--brandt);min-width:1.6em;font-size:16px;padding-top:2px}
.q .qb{flex:1;font-size:16.5px;line-height:1.8}
.qm{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.go{border:0;background:var(--brands);color:var(--brandt);font-size:12.5px;font-weight:700;border-radius:7px;padding:3px 9px}

/* ── 모의고사 ── */
.mbox{margin:4px 12px 12px;background:#fff;border-radius:18px;padding:18px}
.mbox h3{margin:0 0 4px;font-size:19px}
.mbox p{margin:0;color:var(--sub);font-size:14px}
.mbox ul{margin:10px 0 0;padding-left:18px;font-size:14.5px;color:#4e5968}
.mbox li+li{margin-top:4px}
.score{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:4;margin:0 12px 12px;background:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.score .big{font-size:32px;font-weight:800;color:var(--brandt);line-height:1;white-space:nowrap}
.score .big small{font-size:15px;color:var(--sub);font-weight:600}
.score .inf{flex:1;min-width:0}
.score .inf b{display:block;font-size:14.5px}
.score .inf p{margin:0;font-size:12.5px;color:var(--sub)}
.score .act{font-weight:700;font-size:14.5px;padding:10px 14px;border-radius:12px;border:0;background:var(--brand);color:var(--on);white-space:nowrap}
.score .act:disabled{opacity:.45}
.mq .ch{align-items:center}
.mq .ch b{flex:none;font-size:15px}
.mq .ch .ty{font-size:12.5px;color:var(--sub)}
.chipre{font-size:11.5px;font-weight:700;color:var(--brandt);background:var(--brands);border-radius:5px;padding:1px 6px}
.chipre.va{color:#7a5200;background:#fff3cd}
.mark{display:flex;gap:6px;margin-top:12px;align-items:center;flex-wrap:wrap}
.mark span{font-size:13px;color:var(--sub);margin-right:2px}
.mark button{flex:1;min-width:44px;font-weight:700;font-size:15px;padding:10px 6px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.mark button.on.full{border-color:var(--o);background:var(--os);color:var(--o)}
.mark button.on.zero{border-color:var(--x);background:var(--xs);color:var(--x)}
.mark button.on.part{border-color:var(--star);background:#fff6e0;color:#a35f00}
.mq.done{opacity:.86}
.fx{display:none;margin-top:8px;font-size:13px;color:var(--sub)}
.grading .fx{display:block}
.res{text-align:center;padding:10px 0 4px}
.res .big{font-size:52px;font-weight:800;color:var(--brandt);line-height:1.1}
.res .big small{font-size:20px;color:var(--sub)}
.res p{margin:4px 0 0;color:var(--sub);font-size:14px}
.wl{margin:0 12px 10px;background:#fff;border-radius:18px;padding:4px 16px}
.wl .w{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;align-items:flex-start}
.wl .w:last-child{border:0}
.wl .w>b{color:var(--x);min-width:2em}
.wl .w div{flex:1}
.wl .w div small{display:block;color:var(--sub);font-size:12.5px}
.hist{font-size:13.5px;color:var(--sub);margin-top:10px}
.after{font-size:13.5px;color:#4e5968;line-height:1.65}

/* ── 카드 모드 ── */
.deck{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.deck>*{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.dh{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)}
.dh b{color:var(--ink);font-size:16px}
.dh .sp{flex:1}
.dh .x{border:0;background:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1}
.dprog{height:6px;background:#e1e5ea;border-radius:9px;overflow:hidden;margin-top:12px}
.dprog i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .25s}
.dmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin:6px 2px 10px;gap:10px}
.dmeta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{flex:1;min-height:0;position:relative;display:flex}
.stack:before{content:"";position:absolute;left:16px;right:16px;bottom:-7px;height:30px;border-radius:22px;background:#fff;opacity:.6}
.dcard{position:relative;z-index:1;flex:1;min-height:0;background:#fff;border-radius:22px;padding:20px 20px 16px;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(0,0,0,.06);touch-action:pan-y;transition:transform .2s,opacity .2s;overflow-y:auto}
.dcard.drag{transition:none}
.dcard .ct{font-size:13px;color:var(--sub);display:flex;gap:8px;align-items:center}
.dcard .ct .st{font-size:14px}
.dcard .ct .tier{margin:0 0 0 auto}
.dcard h3{font-size:20px;line-height:1.4;margin:6px 0 14px}
.dcard .cb{font-size:18.5px;line-height:1.85}
.dcard .srcs{font-size:12px;color:var(--sub);margin-top:10px}
.dcard .note{margin-top:14px}
.dcard.open .note{display:block}
.dcard .tag{position:absolute;top:18px;font-weight:800;font-size:15px;padding:4px 10px;border-radius:9px;opacity:0}
.dcard .tag.l{left:18px;color:var(--x);background:var(--xs)}.dcard .tag.r{right:18px;color:var(--o);background:var(--os)}
.dacts{display:flex;gap:10px;margin-top:20px}
.dacts button{flex:1;font-weight:800;font-size:16px;padding:16px 0;border-radius:16px;border:0}
.dacts .a1{background:#fff;color:var(--x)}
.dacts .a2{background:#fff;color:var(--ink)}
.dacts .a3{background:var(--brand);color:var(--on)}
.dhint{text-align:center;font-size:12px;color:var(--sub2);margin-top:8px}
.dend{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.dend .em{font-size:48px}
.dend h3{font-size:22px;margin:8px 0 4px}
.dend p{color:var(--sub);margin:0 0 24px}

/* ── 탭바 ── */
.tab{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tab a{flex:1;max-width:150px;text-align:center;font-size:12px;color:var(--sub2);font-weight:600;text-decoration:none;padding:2px 0}
.tab a i{display:block;font-style:normal;font-size:21px;line-height:1.35;filter:grayscale(1);opacity:.5}
.tab a.on{color:var(--ink)}.tab a.on i{filter:none;opacity:1}

@media (min-width:700px){
  .cb{font-size:17.5px}
  .tiles{grid-template-columns:repeat(3,1fr)}
}
</style></head><body>

<script>
(function(){
'use strict';
var LSK='sea-key', LSS='sea-final-v1', LST='sea-theme', DV=1;

/* ── 저장 ── */
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function fresh(){return {v:DV, st:{}, mock:{phase:'idle', t0:0, t1:0, marks:{}, best:null, hist:[]}};}
function loadS(){var s=null;try{s=JSON.parse(ls(LSS)||'null');}catch(e){}
  if(!s||typeof s!=='object')return fresh();
  // 데이터 버전 변환 자리 — 지금은 v1뿐. 버전이 다르면 버리지 말고 여기서 변환할 것.
  if(s.v!==DV){var f=fresh(); if(s.st)f.st=s.st; if(s.mock)f.mock=Object.assign(f.mock,s.mock); s=f;}
  s.st=s.st||{}; s.mock=Object.assign(fresh().mock, s.mock||{}); return s;}
function save(){ls(LSS,JSON.stringify(S));}

/* ── 테마 ── */
function theme(k){var t=THEMES[k]||THEMES[DEFAULT_THEME]||THEMES.teal, r=document.documentElement.style;
  r.setProperty('--brand',t.b);r.setProperty('--brands',t.s);r.setProperty('--on',t.on);r.setProperty('--brandt',t.t);}
theme(ls(LST)||DEFAULT_THEME);

/* ── 복호화 ── */
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function norm(k){return String(k||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
async function unlock(key){
  var n=norm(key); if(n.length<6) throw new Error('short');
  var slot=PAYLOAD.slots[n.slice(0,2)]; if(!slot) throw new Error('nokey');
  var enc=new TextEncoder(), sub=crypto.subtle;
  var base=await sub.importKey('raw',enc.encode(n),'PBKDF2',false,['deriveKey']);
  var kek=await sub.deriveKey({name:'PBKDF2',salt:b64(slot.s),iterations:PAYLOAD.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var ck=await sub.decrypt({name:'AES-GCM',iv:b64(slot.i)},kek,b64(slot.w));
  var dk=await sub.importKey('raw',ck,'AES-GCM',false,['decrypt']);
  var pt=await sub.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},dk,b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function lockScreen(msg){
  TAB.classList.add('hidden'); DK.innerHTML='';
  V.innerHTML='<div class="lock"><div class="em">🌏</div><div class="k">GEFC054 · 2026-2 기말 대비</div>'+
   '<h1>동남아시아의<br>지역성과 문화</h1><p>받은 접근키를 입력하면 열려요</p>'+
   '<form id="lf"><input id="lk" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="접근키 (예: 01-ABCD-EFGH)" aria-label="접근키">'+
   '<button class="btn" id="lb">열기</button></form><div class="err" id="le">'+(msg||'')+'</div><small>키는 이 기기에만 기억돼요</small></div>';
  var f=document.getElementById('lf'), b=document.getElementById('lb'), e=document.getElementById('le');
  f.onsubmit=function(ev){ev.preventDefault(); var k=document.getElementById('lk').value;
    b.disabled=true; b.textContent='여는 중…'; e.textContent='';
    unlock(k).then(function(d){ls(LSK,norm(k)); start(d);}).catch(function(err){
      b.disabled=false; b.textContent='열기';
      e.textContent = !window.crypto||!crypto.subtle ? '이 브라우저에선 열 수 없어요 (https 주소로 열어주세요)' :

    });};
}

/* ── 시작 ── */
function start(d){
  D=d; S=loadS(); CARDS=[]; BYID={};
  D.sections.forEach(function(s){s.cards.forEach(function(c){c.sec=s; CARDS.push(c); BYID[c.id]=c;});});
  ui.exam=D.exams[0].id;
  TAB.classList.remove('hidden');
  window.onhashchange=route; route();
}

function route(){
  var h=(location.hash||'#/home').slice(2).split('/'), t=h[0]||'home';
  if(['home','study','exam','mock'].indexOf(t)<0)t='home';
  [].forEach.call(TAB.querySelectorAll('a'),function(a){a.classList.toggle('on',a.dataset.t===t);});
  stopTimer();
  if(t==='home')home(); else if(t==='study')study(h[1]); else if(t==='exam')exam(h[1]); else mock();
}

/* ── 공통 조각 ── */
function cnt(){var k=0,x=0;CARDS.forEach(function(c){if(S.st[c.id]==='k')k++;else if(S.st[c.id]==='x')x++;});return{k:k,x:x,n:CARDS.length};}
function stars(n){return '★★★'.slice(0,n);}
function short(t){return t.split(' — ')[0];}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ── 홈 ── */

     '<div class="dend"><div class="em">'+(dk.x?'💪':'🎉')+'</div><h3>'+n+'장 끝</h3><p>알아 '+dk.k+' · 모름 '+dk.x+'</p>'+

    return;
  }

  DK.innerHTML='<div class="deck"><div class="dh"><b>'+esc(dk.label)+'</b><span class="sp"></span><span>'+(st==='x'?'지금 모름':st==='k'?'지금 알아':'')+'</span><button class="x" id="dX" aria-label="닫기">✕</button></div>'+
   '<div class="dprog"><i style="width:'+(dk.i/n*100)+'%"></i></div><div class="dmeta"><span>'+c.sec.n+'. '+esc(short(c.sec.title))+'</span><span>'+(dk.i+1)+' / '+n+'</span></div>'+

   '<h3>'+esc(c.title)+'</h3><div class="cb">'+c.body+'</div><div class="srcs">'+esc(c.srcs.join(' · '))+(c.nt?' · '+esc(c.nt):'')+'</div><div class="note">'+c.note+'</div></article></div>'+
   '<div class="dacts"><button class="a1" id="d1">모름</button><button class="a2" id="d2">정답</button><button class="a3" id="d3">알아 →</button></div>'+
   '<div class="dhint">빈칸을 눌러 하나씩 열기 · 오른쪽으로 밀면 알아, 왼쪽은 모름'+(dk.i?' · <a href="#" id="dB" style="color:inherit">이전 카드</a>':'')+'</div></div>';
  var card=DK.querySelector('#dc');
  DK.querySelector('#dX').onclick=closeDeck;
  DK.querySelector('#d1').onclick=function(){judge('x');};
  DK.querySelector('#d3').onclick=function(){judge('k');};
  DK.querySelector('#d2').onclick=function(){var o=!card.classList.contains('open');card.classList.toggle('open',o);
    [].forEach.call(card.querySelectorAll('.bl,.oxbox'),function(b){b.classList.toggle('on',o);});this.textContent=o?'가리기':'정답';
    if(o)card.querySelector('.note').scrollIntoView({block:'nearest'});};
  var bb=DK.querySelector('#dB'); if(bb)bb.onclick=function(e){e.preventDefault();dk.i--;drawDeck();};
  swipe(card);
}
function judge(v){
  var id=dk.ids[dk.i]; S.st[id]=v; save(); if(v==='k')dk.k++;else dk.x++;
  var card=DK.querySelector('#dc');
  if(card){card.style.transform='translateX('+(v==='k'?'':'-')+'110%) rotate('+(v==='k'?8:-8)+'deg)';card.style.opacity='0';}
  setTimeout(function(){if(dk){dk.i++;drawDeck();}},180);
}
function swipe(el){
  var x0=null,y0=0,dx=0,lock=null;
  el.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'&&e.button)return;x0=e.clientX;y0=e.clientY;dx=0;lock=null;});
  el.addEventListener('pointermove',function(e){if(x0===null)return;var mx=e.clientX-x0,my=e.clientY-y0;
    if(lock===null&&(Math.abs(mx)>8||Math.abs(my)>8))lock=Math.abs(mx)>Math.abs(my)?'x':'y';
    if(lock!=='x')return; dx=mx; el.classList.add('drag');
    el.style.transform='translateX('+dx+'px) rotate('+(dx/24)+'deg)';
    el.querySelector('.tag.r').style.opacity=Math.max(0,Math.min(1,dx/90));
    el.querySelector('.tag.l').style.opacity=Math.max(0,Math.min(1,-dx/90));});
  function end(){if(x0===null)return;x0=null;el.classList.remove('drag');
    if(lock==='x'&&Math.abs(dx)>90){judge(dx>0?'k':'x');}
    else{el.style.transform='';[].forEach.call(el.querySelectorAll('.tag'),function(t){t.style.opacity=0;});}}
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
document.addEventListener('keydown',function(e){if(!dk||dk.i>=dk.ids.length)return;
  if(e.key==='ArrowRight')judge('k');else if(e.key==='ArrowLeft')judge('x');else if(e.key==='Escape')closeDeck();});

var timer=null;
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function fmt(ms){var s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60);return m+':'+('0'+(s%60)).slice(-2);}
function pts(q){return q.kind==='ox'?1:q.blanks;}
function mockScore(){var M=S.mock,raw=0,left=0,tot=0;D.mock.qs.forEach(function(q){tot+=pts(q);var v=M.marks[q.n];if(v==null)left++;else raw+=v;});return{raw:raw,left:left,tot:tot,sc:Math.min(raw,50)};}
function ntCard(rf){var m=CARDS.filter(function(c){return c.nt==='정리노트 '+rf;});return m.length?m[0]:null;}
function mock(){
  var M=S.mock, Q=D.mock.qs, h='<div class="top"><div class="k">'+esc(D.mock.when)+'</div><h2>기말 모의고사</h2></div>';
  if(M.phase==='idle'||M.phase==='done'){
    if(M.phase==='done'){
      var r=mockScore(), wrong=Q.filter(function(q){return (M.marks[q.n]||0)<pts(q);});
      h+='<div class="mbox res"><div class="big">'+r.sc+'<small> / 50</small></div><p>원점수 '+r.raw+' / '+r.tot+(r.raw>50?' · 보너스 '+(r.raw-50):'')+' · '+fmt(M.t1-M.t0)+' 소요</p></div>';
      if(wrong.length){h+='<div class="lab">틀린 문항 '+wrong.length+'</div><div class="wl">'+wrong.map(function(q){var c=ntCard(q.rf);
        return '<div class="w"><b>'+q.n+'</b><div>'+esc(q.av)+'<small>'+esc(q.chip)+' · '+esc(q.fx)+' · 정리노트 '+esc(q.rf)+'</small></div>'+(c?'<button class="go" data-go="'+c.id+'">개념 '+c.id+' ›</button>':'')+'</div>';}).join('')+'</div>';}
      h+='<div class="mbox"><div class="after">'+D.mock.after+'</div></div>';
    }
    h+='<div class="mbox"><h3>'+(M.phase==='done'?'다시 풀기':'시작 전에')+'</h3><ul>'+D.mock.inst.map(function(i){return '<li>'+i+'</li>';}).join('')+
       '<li>푸는 동안엔 정답이 안 열려요. 다 풀면 「채점하기」 → 빈칸을 눌러 정답 확인 → 맞은 개수를 직접 체크.</li></ul>'+
       (M.hist.length?'<div class="hist">기록: '+M.hist.slice(-5).map(function(x){return x.d+' '+x.s+'점';}).join(' · ')+(M.best!=null?' · 최고 '+M.best:'')+'</div>':'')+
       '<button class="btn" id="mS">'+(M.phase==='done'?'처음부터 다시 풀기':'시작하기')+'</button></div>';

    return;
  }
  var grading=M.phase==='grade', r2=mockScore();

     '<div class="big">'+r2.sc+'<small> / 50</small></div><div class="inf"><b>채점 중 · '+r2.left+'문항 남음</b><p>원점수 '+r2.raw+' / '+r2.tot+' · 빈칸 눌러 정답 확인</p></div><button class="act" id="mF"'+(r2.left?' disabled':'')+'>완료</button>':
     '<div class="big" id="mT">'+fmt(Date.now()-M.t0)+'</div><div class="inf"><b>푸는 중</b><p>머릿속·종이에 답 쓰고 다 풀면 채점</p></div><button class="act" id="mG">채점하기</button>')+'</div>';
  h+='<div class="'+(grading?'grading':'locked')+'">';

    var v=M.marks[q.n], p=pts(q), btns='';

    }
    h+='<article class="card mq'+(v!=null?' done':'')+'" id="m'+q.n+'"><div class="ch"><b>'+q.n+'번</b>'+(grading?'<span class="chipre'+(q.chip==='변형'?' va':'')+'">'+esc(q.chip)+'</span>':'')+
       '<span class="ty">'+(q.kind==='ox'?'O/X · 1점':'빈칸 '+q.blanks+' · '+q.blanks+'점')+'</span></div><div class="cb">'+q.body+'</div>'+
       (grading?'<div class="fx">'+esc(q.fx)+' · 정리노트 '+esc(q.rf)+'</div><div class="mark">'+btns+'</div>':'')+'</article>';
  });

     '<div style="text-align:center;padding:14px"><button class="lnk dng" id="mQ">그만두고 처음으로</button></div>';
  var y=window.scrollY; V.innerHTML=h;
  if(!grading){timer=setInterval(function(){var t=document.getElementById('mT');if(t)t.textContent=fmt(Date.now()-M.t0);else stopTimer();},1000);
    var g=function(){M.phase='grade';M.t1=Date.now();save();mock();window.scrollTo(0,0);};

  else{

      var r=mockScore(), sc=document.getElementById('mSc');

      sc.querySelector('.inf b').textContent='채점 중 · '+r.left+'문항 남음';

      document.getElementById('mF').disabled=!!r.left;
    };});
    V.querySelector('#mF').onclick=function(){var r=mockScore();M.phase='done';
